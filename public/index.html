<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bovarea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="header">
      <div>
        <h1>Bovarea</h1>
        <p class="tagline">Where quiet conversations begin...</p>
        <p id="status">Connecting...</p>
      </div>

      <div class="header-right">
        <button
          id="changeNameButton"
          class="change-name-button"
          type="button"
          title="Change username"
        >
          Change name
        </button>

        <div class="online-dot" id="onlineDot"></div>
      </div>
    </header>

    <section class="name-panel" id="namePanel">
      <label for="nameInput">Choose a username</label>

      <div class="name-row">
        <input
          id="nameInput"
          maxlength="24"
          placeholder="Your name"
          autocomplete="off"
        >

        <button id="joinButton" type="button">
          Join
        </button>
      </div>
    </section>

    <!-- Change username panel -->
    <section class="name-change-panel" id="nameChangePanel">
      <div class="name-change-title">
        Change username
      </div>

      <input
        id="newNameInput"
        maxlength="24"
        placeholder="New username"
        autocomplete="off"
      >

      <div class="name-change-buttons">
        <button
          id="cancelNameButton"
          type="button"
          class="name-cancel-button"
        >
          Cancel
        </button>

        <button
          id="saveNameButton"
          type="button"
          class="name-save-button"
        >
          Save
        </button>
      </div>
    </section>

    <section
      class="chat-window"
      id="chat-window"
      aria-live="polite"
    ></section>

    <form class="composer" id="chatForm">
      <input
        id="message-input"
        maxlength="500"
        autocomplete="off"
        placeholder="Type a message..."
        disabled
      >

      <button
        id="send-button"
        type="submit"
        disabled
        aria-label="Send message"
      >
        ➤
      </button>
    </form>

  </main>

  <script src="app.js"></script>
</body>
</html>
