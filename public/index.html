<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bovarea</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Easter egg effects: night stars / love hearts -->
  <div id="special-effects" aria-hidden="true"></div>

  <main class="app">

    <header class="header">

      <div>
        <h1>Bovarea</h1>

        <p class="tagline">
          Where quiet conversations begin...
        </p>

        <p id="status">
          Connecting...
        </p>
      </div>

      <div class="header-right">

        <button
          id="changeNameButton"
          class="change-name-button"
          type="button"
        >
          Change name
        </button>

        <div
          class="online-dot"
          id="onlineDot"
        ></div>

      </div>

    </header>


    <!-- ROOM PANEL -->

    <section
      class="room-panel"
      id="roomPanel"
    >

      <label for="roomInput">
        Enter room code
      </label>

      <div class="room-row">

        <input
          id="roomInput"
          maxlength="100"
          autocomplete="off"
          placeholder="Any room code..."
        >

        <button
          id="roomButton"
          type="button"
        >
          Enter
        </button>

      </div>

      <p class="room-hint">
        Anyone using the same code enters the same room.
      </p>

    </section>


    <!-- USERNAME PANEL -->

    <section
      class="name-panel"
      id="namePanel"
    >

      <label for="nameInput">
        Choose a username
      </label>

      <div class="name-row">

        <input
          id="nameInput"
          maxlength="24"
          autocomplete="off"
          placeholder="Your name"
        >

        <button
          id="joinButton"
          type="button"
        >
          Join
        </button>

      </div>

    </section>


    <!-- CHANGE NAME PANEL -->

    <section
      class="name-change-panel"
      id="nameChangePanel"
    >

      <div class="name-change-title">
        Change username
      </div>

      <input
        id="newNameInput"
        maxlength="24"
        autocomplete="off"
        placeholder="New username"
      >

      <div class="name-change-buttons">

        <button
          id="cancelNameButton"
          class="name-cancel-button"
          type="button"
        >
          Cancel
        </button>

        <button
          id="saveNameButton"
          class="name-save-button"
          type="button"
        >
          Save
        </button>

      </div>

    </section>


    <!-- CHAT -->

    <section
      class="chat-window"
      id="chat-window"
      aria-live="polite"
    ></section>


    <!-- COMPOSER -->

    <form
      class="composer"
      id="chatForm"
    >

      <input
        id="message-input"
        maxlength="500"
        autocomplete="off"
        placeholder="Type a message..."
        disabled
      >

      <button
        id="send-button"
        type="submit"
        disabled
        aria-label="Send message"
      >
        ➤
      </button>

    </form>

  </main>

  <script src="app.js"></script>

</body>
</html>
